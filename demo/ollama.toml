# Local Ollama candidate confirmed by the user on 2026-11-22.
# Use the environment setup in demo/README.md; no credentials belong here.
[paths]
raw_dir = "data/raw"
manifest = "data/raw/manifest.json"
index_dir = "data/index/t5-ollama-fixed"

[chunking]
strategy = "fixed"
size = 600
overlap = 80

[embedding]
provider = "local"
local_model = "all-MiniLM-L6-v2"
local_dimension = 384
api_model = "text-embedding-3-small"
api_dimension = 1536

[llm]
model = "qwen3:4b-instruct"
temperature = 0.0
max_tokens = 512

[retrieval]
top_k = 3
min_score = 0.0
